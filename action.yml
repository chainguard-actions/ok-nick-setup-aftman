name: setup-aftman
description: Github action to install and run aftman; a toolchain manager.
author: ok-nick
inputs:
  version:
    description: "`aftman` git tag (usually in the form vx.x.x)"
    required: false
  path:
    description: "Path to the `aftman.toml` directory"
    default: "."
    required: false
  cache:
    description: "Whether to enable caching"
    default: "false"
    required: false
  token:
    description: "GitHub token via `github.token`"
    default: "${{ github.token }}"
    required: false
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Download aftman
      run: |
        case "$RUNNER_OS" in
          Linux) pattern="*linux-x86_64.zip" ;;
          macOS) pattern="*macos-x86_64.zip" ;;
          Windows) pattern="*windows-x86_64.zip" ;;
        esac

        gh release download ${INPUT_VERSION:+"$INPUT_VERSION"} --repo LPGhatguy/aftman --pattern "$pattern"
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        INPUT_VERSION: ${{ inputs.version }}
        RUNNER_OS: ${{ runner.os }}
      shell: bash
    - name: Install aftman
      run: |
        unzip aftman*.zip
        ./aftman self-install
      shell: bash
    - name: Delete artifacts
      run: |
        rm aftman*.zip
        if [ "$RUNNER_OS" = "Windows" ]; then
          rm aftman.exe
        else
          rm aftman
        fi
      env:
        RUNNER_OS: ${{ runner.os }}
      shell: bash
    - name: Set environment variable
      if: runner.os == 'Windows'
      run: echo "$HOME/.aftman/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell
    - name: Set environment variable
      if: runner.os != 'Windows'
      run: echo "$HOME/.aftman/bin" >> $GITHUB_PATH
      shell: bash
    - name: Create auth file
      run: |
        cat > $HOME/.aftman/auth.toml << EOF
        github = "$INPUT_TOKEN"
        EOF
      env:
        INPUT_TOKEN: ${{ inputs.token }}
      shell: bash
    - name: Cache binaries
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      with:
        path: |
          ~/.aftman/bin
          ~/.aftman/tool-storage
        key: ${{ runner.os }}-aftman-${{hashFiles(format('{0}/{1}', inputs.path, 'aftman.toml'))}}
    - name: Install tools
      run: |
        cd "$INPUT_PATH"
        aftman install --no-trust-check
      env:
        INPUT_PATH: ${{ inputs.path }}
      shell: bash
branding:
  icon: link-2
  color: blue
